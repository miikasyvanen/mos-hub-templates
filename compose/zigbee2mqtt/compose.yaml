services:
    zigbee2mqtt:
        container_name: zigbee2mqtt
        image: ghcr.io/koenkk/zigbee2mqtt:latest
        restart: unless-stopped
        network_mode: host
        volumes:
            - ./data:/app/data
            - /run/udev:/run/udev:ro
        ports:
            - ${MQTT_PORT}:8080
        environment:
            - TZ=Europe/Helsinki
        devices:
            # Make sure this matched your adapter location
            - source: /dev/serial/by-id/usb-Texas_Instruments_TI_CC2531_USB_CDC___0X00124B0018ED3DDF-if00
              target: /dev/ttyACM0
              permissions: rwm
